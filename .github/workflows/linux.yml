name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # `SIMDLY_REQUIRE_BACKENDS` makes the test suite fail if a listed backend is
  # not available, so backend tests cannot pass by skipping (see
  # `src/detect.rs`). With `std` backends are detected at runtime; without it
  # only target features enabled at compile time count.
  backend:
    name: ${{ matrix.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No flags: what a user gets by default.
          - name: dispatch
            os: ubuntu-26.04
            rustflags: ""
            require: scalar,avx2
            require-no-std: scalar
          # GitHub-hosted runners are not guaranteed to have AVX-512, so this
          # runs under Intel SDE emulating Sapphire Rapids.
          - name: dispatch-sde
            os: ubuntu-26.04
            rustflags: ""
            require: avx2,avx512
            require-no-std: scalar
            sde: true
          # AVX2 enabled at compile time, the only way to get it without `std`.
          - name: static-avx2
            os: ubuntu-26.04
            rustflags: "-C target-cpu=x86-64-v3"
            require: avx2
            require-no-std: avx2
          - name: neon
            os: ubuntu-26.04-arm
            rustflags: ""
            require: neon
            require-no-std: neon
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Set up Intel SDE
        if: matrix.sde
        uses: petarpetrovt/setup-sde@v6.0
      - name: Route cargo test through SDE
        if: matrix.sde
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$SDE_PATH/sde64 -spr --" >> "$GITHUB_ENV"
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test
        run: cargo test --all-features
        env:
          SIMDLY_REQUIRE_BACKENDS: ${{ matrix.require }}
      - name: Test (no default features)
        run: cargo test --no-default-features
        env:
          SIMDLY_REQUIRE_BACKENDS: ${{ matrix.require-no-std }}

  # The jobs below do not depend on the host OS, so they run once, here.

  fmt:
    name: Format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Build for targets that have no `std` at all, so an accidental `std`
  # dependency fails here rather than for a downstream user. The softfloat
  # aarch64 target has NEON disabled, exercising the aarch64 scalar fallback;
  # x86_64-unknown-none is soft-float, exercising the x86_64 one.
  no-std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, aarch64-unknown-none-softfloat, x86_64-unknown-none]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --target ${{ matrix.target }} --no-default-features
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features alloc

  # Keep in sync with `rust-version` in Cargo.toml. The version goes in
  # `toolchain`, not the `@ref`: Dependabot treats `@1.89` as an action
  # version and would "bump" the MSRV.
  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features
      - run: cargo check --no-default-features

  docs:
    name: Docs
    runs-on: ubuntu-26.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
      - run: cargo doc --no-deps --all-features --document-private-items

  # Builds the crate from the packaged `.crate` file, catching files missing
  # from the `include` allow-list before a real publish does.
  package:
    name: Package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run
