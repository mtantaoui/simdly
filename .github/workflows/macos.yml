name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # `SIMDLY_REQUIRE_BACKENDS` makes the test suite fail if a listed backend is
  # not available, so backend tests cannot pass by skipping (see
  # `src/detect.rs`). With `std` backends are detected at runtime; without it
  # only target features enabled at compile time count.
  backend:
    name: ${{ matrix.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon; NEON is enabled by default on aarch64-apple-darwin.
          - name: neon
            os: macos-26
            require: neon
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test
        run: cargo test --all-features
        env:
          SIMDLY_REQUIRE_BACKENDS: ${{ matrix.require }}
      - name: Test (no default features)
        run: cargo test --no-default-features
        env:
          SIMDLY_REQUIRE_BACKENDS: ${{ matrix.require-no-std || matrix.require }}
