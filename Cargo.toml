[package]
name = "simdly"
version = "0.1.1"
edition = "2024"
# 1.89 stabilised the AVX-512 intrinsics.
rust-version = "1.89"
authors = ["Mahdi Tantaoui <mohamedalmahdi.tantaoui@gmail.com>"]
description = "SIMD implementations of mathematical functions for Rust (AVX2, AVX-512, NEON) with documented worst-case ULP bounds."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mtantaoui/simdly"
documentation = "https://docs.rs/simdly"
readme = "README.md"
keywords = ["simd", "math", "avx", "neon", "vector"]
categories = ["mathematics", "hardware-support", "no-std"]
# Allow-list: anything not named here (book/, .github/, tools) stays out of
# the published package.
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["std"]
# Runtime CPU feature detection needs `std`.
std = ["alloc"]
# `Vec`-returning APIs (`SliceExt::add`, …).
alloc = []
# `ParSliceMath`, `ParSliceExt`: math, arithmetic and comparisons on several
# threads, for long slices.
rayon = ["std", "dep:rayon"]

[dependencies]
rayon = { version = "1.10", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

# One benchmark per public operation, against the plain scalar loop a user
# would write instead.
[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "arithmetic"
harness = false
required-features = ["alloc"]

[[bench]]
name = "comparison"
harness = false
required-features = ["alloc"]

[[bench]]
name = "math"
harness = false
required-features = ["alloc"]

[[example]]
name = "arithmetic"
required-features = ["alloc"]

[[example]]
name = "comparison"
required-features = ["alloc"]

[[example]]
name = "math"
required-features = ["alloc"]

[[example]]
name = "parallel"
required-features = ["rayon"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
